name: Android Build
on: workflow_dispatch
jobs:
  build:
    name: Android Build
    permissions: write-all
    runs-on: ubuntu-22.04
    steps:
      - name: Pulling the new commit
        uses: actions/checkout@v4
      - name: Setting up Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@main
        with:
          ndk-version: r25c
      - name: Restore Previous Cache
        id: cache-debug-build-android-restore
        uses: actions/cache/restore@main
        with:
          path: |
            .haxelib/
            export/release/android/haxe/
            export/release/android/obj/
          key: cache-android-build-hx437
      - name: Installing/Updating libraries
        run: |
          haxe -cp commandline -D analyzer-optimize --run Main setup -s
          haxelib run lime rebuild hxcpp

      - name: Pin flixel to the old branch
        run: |
          ROOT=$(pwd)
          cd "$ROOT/.haxelib/flixel/git"
          git fetch --all || true

          echo "=== tanggal commit terakhir tiap branch cne-flixel ==="
          for b in old cne dev; do
            git log -1 --format="$b: %h %ad %s" --date=short origin/$b || true
          done

          if git rev-parse --verify origin/old >/dev/null 2>&1; then
            echo "Pakai branch old"
            git checkout -f origin/old
          else
            echo "Branch old tidak ada, pakai commit sebelum audio rework"
            git checkout -f "$(git rev-list -n 1 --before=2026-02-26 origin/dev)"
          fi

          echo "=== flixel sekarang di commit ==="
          git log -1 --format="%H %ad %an %s" --date=short

          echo "=== AudioDecoder di flixel (harusnya kosong) ==="
          grep -rl "AudioDecoder" . --include=*.hx | head -5 || true
          echo "=== cek versi addons di FlxDefines.hx ==="
          grep -n "Addons" flixel/system/macros/FlxDefines.hx | head -10 || true

          cd "$ROOT"
          haxelib set flixel git
          haxelib set lime git || true
          haxelib set openfl git || true
          haxelib list

          echo "=== tanggal commit semua library git ==="
          for d in .haxelib/*/git; do
            lib=$(basename "$(dirname "$d")")
            echo "$lib: $(git -C "$d" log -1 --format='%h %ad %s' --date=short 2>/dev/null)"
          done

      - name: Configure Android
        run: |
          haxelib run lime setup -alias -y
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME_17_X64
          haxelib run lime config ANDROID_SETUP true
      - name: Building the game
        run: |
          haxelib run lime build android -final
      - name: Clear Previous Cache
        uses: actions/github-script@main
        with:
          script: |
            try {
              const caches = await github.rest.actions.getActionsCacheList({
                owner: context.repo.owner,
                repo: context.repo.repo,
              })
              if (typeof caches.data.actions_caches != null && caches.data.actions_caches.length > 0) {
                for (const cache of caches.data.actions_caches) {
                  if (cache.key == "cache-android-build-hx437") {
                    console.log('Clearing ' + cache.key + '...')
                    await github.rest.actions.deleteActionsCacheById({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      cache_id: cache.id,
                    })
                    console.log("Previous Cache Cleared!")
                  }
                }
              }
            } catch (error) {
              console.log(error.message);
            }
      - name: Save Current Cache
        id: cache-release-build-android-save
        uses: actions/cache/save@main
        with:
          path: |
            .haxelib/
            export/release/android/haxe/
            export/release/android/obj/
          key: cache-android-build-hx437
      - name: Uploading artifact (entire build)
        uses: actions/upload-artifact@v4
        with:
          name: Codename Engine Legacy Android
          path: export/release/android/bin/app/build/outputs/apk/*
