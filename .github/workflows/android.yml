name: Android Build
on:
  workflow_dispatch:
    inputs:
      haxe:
        description: "Versi Haxe"
        type: string
        default: "4.2.5"
      pin_dates:
        description: "Tanggal pin library (pisah spasi, dicoba berurutan)"
        type: string
        default: "2026-01-10 2026-01-25 2025-12-25"
      release:
        description: "Buat GitHub Release dari APK"
        type: boolean
        default: false
jobs:
  build:
    name: Android Build (mesin waktu)
    permissions: write-all
    runs-on: ubuntu-22.04
    steps:
      - name: Pulling the new commit
        uses: actions/checkout@v4
      - name: Setting up Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: ${{ inputs.haxe }}
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@main
        with:
          ndk-version: r25c
      - name: Restore Previous Cache
        id: cache-debug-build-android-restore
        uses: actions/cache/restore@main
        with:
          path: |
            .haxelib/
            export/release/android/haxe/
            export/release/android/obj/
          key: cache-android-build-${{ inputs.haxe }}-tm
      - name: Installing libraries
        run: |
          haxe -cp commandline -D analyzer-optimize --run Main setup -s

      - name: Time machine build
        env:
          PIN_DATES: ${{ inputs.pin_dates }}
        run: |
          git config --global advice.detachedHead false
          ROOT=$(pwd)
          SUMMARY="$ROOT/summary.txt"
          : > "$SUMMARY"
          : > "$ROOT/orig_heads.txt"

          # Catat commit awal tiap library git
          for d in "$ROOT"/.haxelib/*/git; do
            [ -d "$d/.git" ] || continue
            lib=$(basename "$(dirname "$d")")
            echo "$lib $(git -C "$d" rev-parse HEAD)" >> "$ROOT/orig_heads.txt"
          done

          # Patch flixel-ui: INPUT_KEYS (tidak berbahaya kalau tidak perlu)
          for F in $(find "$ROOT/.haxelib/flixel-ui" -name FlxUICursor.hx); do
            sed -i 's/InputMethod:Int = INPUT_KEYS/InputMethod:Int = 1/' "$F" || true
          done

          pin_all() {
            DATE=$1
            for d in "$ROOT"/.haxelib/*/git; do
              [ -d "$d/.git" ] || continue
              lib=$(basename "$(dirname "$d")")
              O=$(grep "^$lib " "$ROOT/orig_heads.txt" | cut -d' ' -f2)
              T=$(git -C "$d" rev-list -n 1 --before="$DATE 23:59:59" "$O" 2>/dev/null || true)
              if [ -n "$T" ]; then
                git -C "$d" checkout -q -f "$T" || true
                echo "  $lib -> $(git -C "$d" log -1 --format='%h %ad' --date=short)"
              else
                echo "  $lib: tidak ada commit sebelum $DATE (dibiarkan)"
              fi
            done
          }

          apply() {
            git -C "$ROOT" checkout -- source 2>/dev/null || true
            haxelib set flixel git > /dev/null || true
            case $1 in
              fork) haxelib set lime git > /dev/null;   haxelib set openfl git > /dev/null ;;
              mixo) haxelib set lime 8.3.2 > /dev/null; haxelib set openfl git > /dev/null ;;
            esac
            haxelib set flixel-ui 2.6.1 > /dev/null || true
            for F in source/funkin/backend/system/framerate/Framerate.hx source/funkin/backend/system/framerate/FramerateCategory.hx; do
              if [ -f "$ROOT/$F" ]; then
                sed -i -E 's/(__enterFrame[[:space:]]*\([[:space:]]*[A-Za-z_]+[[:space:]]*:[[:space:]]*)Float/\1Int/' "$ROOT/$F" || true
              fi
            done
          }

          attempt() {
            rm -rf "$ROOT/export"
            ( set -o pipefail; haxelib run lime build android -final 2>&1 | tee build.log ) &
            PID=$!
            PASSED=0
            for i in $(seq 1 24); do
              sleep 5
              kill -0 $PID 2>/dev/null || break
            done
            if kill -0 $PID 2>/dev/null; then
              PASSED=1
              echo ">>> Lolos pemeriksaan Haxe, lanjut build penuh (bisa ~50 menit)"
            fi
            wait $PID && RC=0 || RC=$?
          }

          short() {
            grep -E "characters [0-9]+-[0-9]+ : |lines [0-9]+-[0-9]+ : |Error" "$1" | grep -v "Warning" | sort -u | head -3 | sed -E 's#^.*/\.haxelib/##; s#characters [0-9]+-[0-9]+ ##'
          }

          FOUND=0
          for DATE in $PIN_DATES; do
            echo "##### TANGGAL $DATE #####"
            pin_all "$DATE"
            if ! haxelib run lime rebuild hxcpp > rebuild.log 2>&1; then
              { echo "## $DATE: rebuild hxcpp gagal"; short rebuild.log; } >> "$SUMMARY" || true
              continue
            fi
            haxelib run lime setup -alias -y > /dev/null
            haxelib run lime config ANDROID_SDK $ANDROID_HOME > /dev/null
            haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_HOME > /dev/null
            haxelib run lime config JAVA_HOME $JAVA_HOME_17_X64 > /dev/null
            haxelib run lime config ANDROID_SETUP true > /dev/null
            for MODE in fork mixo; do
              echo "--- $DATE / $MODE"
              apply $MODE
              attempt
              if [ "$RC" = "0" ]; then
                FOUND=1
                echo "BERHASIL: $DATE / $MODE"
                break 2
              fi
              { echo "## $DATE / $MODE (lolos_haxe=$PASSED)"; short build.log; } >> "$SUMMARY" || true
              if [ "$PASSED" = "1" ]; then
                break 2
              fi
            done
          done

          cat "$SUMMARY" >> "$GITHUB_STEP_SUMMARY" || true

          if [ "$FOUND" != "1" ]; then
            echo ""
            echo "=========== RINGKASAN ==========="
            cat "$SUMMARY"
            exit 1
          fi

      - name: Clear Previous Cache
        uses: actions/github-script@main
        with:
          script: |
            try {
              const caches = await github.rest.actions.getActionsCacheList({
                owner: context.repo.owner,
                repo: context.repo.repo,
              })
              if (typeof caches.data.actions_caches != null && caches.data.actions_caches.length > 0) {
                for (const cache of caches.data.actions_caches) {
                  if (cache.key == "cache-android-build-${{ inputs.haxe }}-tm") {
                    console.log('Clearing ' + cache.key + '...')
                    await github.rest.actions.deleteActionsCacheById({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      cache_id: cache.id,
                    })
                    console.log("Previous Cache Cleared!")
                  }
                }
              }
            } catch (error) {
              console.log(error.message);
            }
      - name: Save Current Cache
        id: cache-release-build-android-save
        uses: actions/cache/save@main
        with:
          path: |
            .haxelib/
            export/release/android/haxe/
            export/release/android/obj/
          key: cache-android-build-${{ inputs.haxe }}-tm
      - name: Uploading artifact (entire build)
        uses: actions/upload-artifact@v4
        with:
          name: Codename Engine Legacy Android
          path: export/release/android/bin/app/build/outputs/apk/*
      - name: Create release
        if: success() && inputs.release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: Codename Engine Legacy Android #${{ github.run_number }}
          files: export/release/android/bin/app/build/outputs/apk/**/*.apk
