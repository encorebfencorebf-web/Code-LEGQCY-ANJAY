name: Android Build
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Buat GitHub Release dari APK"
        type: boolean
        default: false
      start_date:
        description: "Tanggal mulai pin (mundur dari sini)"
        type: string
        default: "2025-06-15"
      end_date:
        description: "Tanggal akhir pin"
        type: string
        default: "2025-02-01"
      step_days:
        description: "Langkah mundur (hari)"
        type: string
        default: "10"
jobs:
  build:
    name: Android Build (Haxe ${{ matrix.haxe }} / libs ${{ matrix.libs }})
    permissions: write-all
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        haxe: ["4.2.5", "4.3.7"]
        libs: [old, repo]
    steps:
      - name: Pulling the new commit
        uses: actions/checkout@v4
      - name: Setting up Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: ${{ matrix.haxe }}
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@main
        with:
          ndk-version: r25c
      - name: Restore Previous Cache
        id: cache-debug-build-android-restore
        uses: actions/cache/restore@main
        with:
          path: |
            .haxelib/
            export/release/android/haxe/
            export/release/android/obj/
          key: cache-android-build-${{ matrix.haxe }}-${{ matrix.libs }}-v010

      - name: Siapkan daftar library
        run: |
          cat > old-libs.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <libraries>
          <lib name="openfl" version="9.2.2" />
          <lib name="lime" version="8.1.2" />
          <git name="flixel" url="https://github.com/CodenameCrew/cne-flixel" />
          <git name="flixel-addons" url="https://github.com/CodenameCrew/cne-flixel-addons" />
          <git name="hscript-improved" url="https://github.com/CodenameCrew/hscript-improved" ref="custom-classes" />
          <git name="flxanimate" url="https://github.com/CodenameCrew/cne-flxanimate" />
          <lib name="hxvlc" version="1.9.3" skipDeps="true" />
          <git name="away3d" url="https://github.com/CodenameCrew/away3d" />
          <lib name="format" />
          <lib name="markdown" />
          <lib name="nape-haxe4" />
          <git name="hxcpp" url="https://github.com/CodenameCrew/cne-hxcpp" />
          <git name="extension-androidtools" url="https://github.com/MAJigsaw77/extension-androidtools" />
          </libraries>
          EOF
          sed -i 's/^ *//' old-libs.xml
          if [ "${{ matrix.libs }}" = "old" ]; then
            cp old-libs.xml libs.xml
            cp old-libs.xml libs-mobile.xml
            echo "Pakai daftar library 0.1.0"
          else
            echo "Pakai libs.xml / libs-mobile.xml dari repo"
          fi
      - name: Installing libraries
        run: |
          haxe -cp commandline -D analyzer-optimize --run Main setup -s

      - name: Smart build
        env:
          LIBS: ${{ matrix.libs }}
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          STEP_DAYS: ${{ inputs.step_days }}
        run: |
          git config --global advice.detachedHead false
          ROOT=$(pwd)
          ERRS="$ROOT/errs.txt";   : > "$ERRS"
          SEEN="$ROOT/seen.txt";   : > "$SEEN"
          : > "$ROOT/orig_heads.txt"

          for d in "$ROOT"/.haxelib/*/git; do
            [ -d "$d/.git" ] || continue
            lib=$(basename "$(dirname "$d")")
            echo "$lib $(git -C "$d" rev-parse HEAD)" >> "$ROOT/orig_heads.txt"
          done

          # Patch flixel-ui: INPUT_KEYS (aman kalau tidak perlu)
          for F in $(find "$ROOT/.haxelib/flixel-ui" -name FlxUICursor.hx); do
            sed -i 's/InputMethod:Int = INPUT_KEYS/InputMethod:Int = 1/' "$F" || true
          done

          pin_all() {
            DATE=$1
            for d in "$ROOT"/.haxelib/*/git; do
              [ -d "$d/.git" ] || continue
              lib=$(basename "$(dirname "$d")")
              O=$(grep "^$lib " "$ROOT/orig_heads.txt" | cut -d' ' -f2)
              T=$(git -C "$d" rev-list -n 1 --before="$DATE 23:59:59" "$O" 2>/dev/null || true)
              if [ -n "$T" ]; then
                git -C "$d" checkout -q -f "$T" || true
              fi
            done
          }

          ver() {
            sed -n 's/.*"version"[^"]*"\([^"]*\)".*/\1/p' "$ROOT/.haxelib/$1/git/haxelib.json" 2>/dev/null | head -1
          }

          apply() {
            git -C "$ROOT" checkout -- source 2>/dev/null || true
            haxelib set flixel git > /dev/null || true
            if [ "$LIBS" = "old" ]; then
              haxelib set lime 8.1.2 > /dev/null
              haxelib set openfl 9.2.2 > /dev/null
            else
              haxelib set lime git > /dev/null
              haxelib set openfl git > /dev/null
              for F in source/funkin/backend/system/framerate/Framerate.hx source/funkin/backend/system/framerate/FramerateCategory.hx; do
                if [ -f "$ROOT/$F" ]; then
                  sed -i -E 's/(__enterFrame[[:space:]]*\([[:space:]]*[A-Za-z_]+[[:space:]]*:[[:space:]]*)Float/\1Int/' "$ROOT/$F" || true
                fi
              done
            fi
          }

          attempt() {
            rm -rf "$ROOT/export"
            ( set -o pipefail; haxelib run lime build android -final 2>&1 | tee build.log ) &
            PID=$!
            PASSED=0
            for i in $(seq 1 24); do
              sleep 5
              kill -0 $PID 2>/dev/null || break
            done
            if kill -0 $PID 2>/dev/null; then
              PASSED=1
              echo ">>> LOLOS pemeriksaan Haxe, lanjut build penuh (sekitar 50 menit)"
            fi
            wait $PID && RC=0 || RC=$?
          }

          short() {
            grep -E "characters [0-9]+-[0-9]+ : |lines [0-9]+-[0-9]+ : |Error" "$1" | grep -v "Warning" | sort -u | head -3 | sed -E 's#^.*/\.haxelib/##; s#characters [0-9]+-[0-9]+ ##' | cut -c1-170
          }

          DATES=""
          d="$START_DATE"
          while [[ "$d" > "$END_DATE" || "$d" == "$END_DATE" ]]; do
            DATES="$DATES $d"
            d=$(date -d "$d - $STEP_DAYS days" +%F)
          done

          FOUND=0
          TRIES=0
          HX_BUILT=""
          CONF=0
          for DATE in $DATES; do
            pin_all "$DATE"
            SIG=$(for d in "$ROOT"/.haxelib/*/git; do [ -d "$d/.git" ] && git -C "$d" rev-parse HEAD; done | sha1sum | cut -c1-12)
            if grep -q "^$SIG$" "$SEEN"; then continue; fi
            echo "$SIG" >> "$SEEN"

            HXN=$(git -C "$ROOT/.haxelib/hxcpp/git" rev-parse HEAD 2>/dev/null || echo none)
            if [ "$HXN" != "$HX_BUILT" ]; then
              if ! haxelib run lime rebuild hxcpp > rebuild.log 2>&1; then
                echo "[rebuild hxcpp gagal] $DATE" >> "$ERRS"
                short rebuild.log >> "$ERRS" || true
                HX_BUILT=""
                continue
              fi
              HX_BUILT=$HXN
            fi

            if [ "$CONF" = "0" ]; then
              haxelib run lime setup -alias -y > /dev/null
              haxelib run lime config ANDROID_SDK $ANDROID_HOME > /dev/null
              haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_HOME > /dev/null
              haxelib run lime config JAVA_HOME $JAVA_HOME_17_X64 > /dev/null
              haxelib run lime config ANDROID_SETUP true > /dev/null
              CONF=1
            fi

            echo "### $DATE flixel=$(git -C "$ROOT/.haxelib/flixel/git" log -1 --format=%h) addons_ver=$(ver flixel-addons)"
            apply
            TRIES=$((TRIES+1))
            attempt
            if [ "$RC" = "0" ]; then
              FOUND=1
              echo "BERHASIL: tanggal=$DATE"
              break
            fi
            if [ "$PASSED" = "1" ]; then
              echo "[LOLOS Haxe, gagal tahap lanjut: $DATE]" >> "$ERRS"
              grep -iE "error" build.log | tail -5 | cut -c1-200 >> "$ERRS" || true
              break
            fi
            short build.log >> "$ERRS" || true
          done

          echo "Total percobaan: $TRIES"
          if [ "$FOUND" != "1" ]; then
            echo ""
            echo "=========== RINGKASAN ($TRIES percobaan) ==========="
            sort "$ERRS" | uniq -c | sort -rn | head -12 | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Clear Previous Cache
        uses: actions/github-script@main
        with:
          script: |
            try {
              const caches = await github.rest.actions.getActionsCacheList({
                owner: context.repo.owner,
                repo: context.repo.repo,
              })
              if (typeof caches.data.actions_caches != null && caches.data.actions_caches.length > 0) {
                for (const cache of caches.data.actions_caches) {
                  if (cache.key == "cache-android-build-${{ matrix.haxe }}-${{ matrix.libs }}-v010") {
                    console.log('Clearing ' + cache.key + '...')
                    await github.rest.actions.deleteActionsCacheById({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      cache_id: cache.id,
                    })
                    console.log("Previous Cache Cleared!")
                  }
                }
              }
            } catch (error) {
              console.log(error.message);
            }
      - name: Save Current Cache
        id: cache-release-build-android-save
        uses: actions/cache/save@main
        with:
          path: |
            .haxelib/
            export/release/android/haxe/
            export/release/android/obj/
          key: cache-android-build-${{ matrix.haxe }}-${{ matrix.libs }}-v010
      - name: Uploading artifact (entire build)
        uses: actions/upload-artifact@v4
        with:
          name: Codename Engine 0.1.0 Android (Haxe ${{ matrix.haxe }} ${{ matrix.libs }})
          path: export/release/android/bin/app/build/outputs/apk/*
      - name: Create release
        if: success() && inputs.release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}-haxe${{ matrix.haxe }}-${{ matrix.libs }}
          name: Codename Engine 0.1.0 Android #${{ github.run_number }} (Haxe ${{ matrix.haxe }} ${{ matrix.libs }})
          files: export/release/android/bin/app/build/outputs/apk/**/*.apk
