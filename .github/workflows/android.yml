name: Android Build
on: workflow_dispatch
jobs:
  build:
    name: Android Build (${{ matrix.hs }} / ui-${{ matrix.ui }})
    permissions: write-all
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        hs: [dev-head, dev-before]
        ui: [release, git]
    steps:
      - name: Pulling the new commit
        uses: actions/checkout@v4
      - name: Setting up Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@main
        with:
          ndk-version: r25c
      - name: Restore Previous Cache
        id: cache-debug-build-android-restore
        uses: actions/cache/restore@main
        with:
          path: |
            .haxelib/
            export/release/android/haxe/
            export/release/android/obj/
          key: cache-android-build-hx437-${{ matrix.hs }}-ui-${{ matrix.ui }}
      - name: Installing/Updating libraries
        run: |
          haxe -cp commandline -D analyzer-optimize --run Main setup -s
          haxelib run lime rebuild hxcpp

      - name: Pin libraries, configure and build
        run: |
          set -o pipefail
          ROOT=$(pwd)

          if [ "${{ matrix.ui }}" = "git" ]; then
            echo "##### FLIXEL-UI: git master #####"
            haxelib git flixel-ui https://github.com/HaxeFlixel/flixel-ui || true
          fi

          echo "##### PIN FLIXEL (branch old) #####"
          cd "$ROOT/.haxelib/flixel/git"
          git fetch --all || true
          git checkout -f origin/old
          git log -1 --format="flixel: %h %ad %s" --date=short

          echo "##### PIN HSCRIPT-IMPROVED (${{ matrix.hs }}) #####"
          cd "$ROOT/.haxelib/hscript-improved/git"
          git fetch --all || true
          git checkout -f origin/codename-dev
          if [ "${{ matrix.hs }}" = "dev-before" ]; then
            A=$(git log --format=%H -S"IMPORT_BLACKLIST" | tail -1)
            echo "commit awal IMPORT_BLACKLIST: $A"
            if [ -n "$A" ]; then
              git checkout -f "${A}^"
            else
              echo "Tidak ketemu, tetap di head codename-dev"
            fi
          fi
          git log -1 --format="hscript-improved: %h %ad %s" --date=short

          cd "$ROOT"
          haxelib set flixel git
          haxelib set lime 8.3.2
          haxelib set openfl 9.5.2
          if [ "${{ matrix.ui }}" = "git" ]; then
            haxelib set flixel-ui git || true
          fi
          haxelib list

          echo "##### DIAGNOSTIK flixel-ui #####"
          grep -rn "INPUT_KEYS" .haxelib/flixel/git .haxelib/flixel-ui --include=*.hx | head -8 || true
          for F in $(find .haxelib/flixel-ui -name FlxUICursor.hx); do
            echo "--- $F"
            sed -n '236,246p' "$F" || true
          done
          grep -rn "IMPORT_BLACKLIST" source .haxelib/hscript-improved/git --include=*.hx | head -5 || true

          echo "##### CONFIGURE ANDROID #####"
          haxelib run lime setup -alias -y
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME_17_X64
          haxelib run lime config ANDROID_SETUP true

          echo "##### BUILD (${{ matrix.hs }} / ui-${{ matrix.ui }}) #####"
          haxelib run lime build android -final 2>&1 | tee build.log

      - name: Ringkasan error
        if: failure()
        run: |
          echo "=== ringkasan error unik ==="
          grep -E "characters [0-9]+-[0-9]+ : |lines [0-9]+-[0-9]+ : |Error" build.log | grep -v "Warning" | sort -u | head -40 || true

      - name: Clear Previous Cache
        uses: actions/github-script@main
        with:
          script: |
            try {
              const caches = await github.rest.actions.getActionsCacheList({
                owner: context.repo.owner,
                repo: context.repo.repo,
              })
              if (typeof caches.data.actions_caches != null && caches.data.actions_caches.length > 0) {
                for (const cache of caches.data.actions_caches) {
                  if (cache.key == "cache-android-build-hx437-${{ matrix.hs }}-ui-${{ matrix.ui }}") {
                    console.log('Clearing ' + cache.key + '...')
                    await github.rest.actions.deleteActionsCacheById({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      cache_id: cache.id,
                    })
                    console.log("Previous Cache Cleared!")
                  }
                }
              }
            } catch (error) {
              console.log(error.message);
            }
      - name: Save Current Cache
        id: cache-release-build-android-save
        uses: actions/cache/save@main
        with:
          path: |
            .haxelib/
            export/release/android/haxe/
            export/release/android/obj/
          key: cache-android-build-hx437-${{ matrix.hs }}-ui-${{ matrix.ui }}
      - name: Uploading artifact (entire build)
        uses: actions/upload-artifact@v4
        with:
          name: Codename Engine Legacy Android ${{ matrix.hs }} ui-${{ matrix.ui }}
          path: export/release/android/bin/app/build/outputs/apk/*
