name: Android Build
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Buat GitHub Release dari APK"
        type: boolean
        default: false
jobs:
  build:
    name: Android Build (${{ matrix.name }})
    permissions: write-all
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "legacy-4.2.5",       haxe: "4.2.5", pin: "2025-06-05", lo: "legacy" }
          - { name: "legacy-mixo-4.2.5",  haxe: "4.2.5", pin: "2025-06-05", lo: "mixo" }
          - { name: "terbaru-4.3.7",      haxe: "4.3.7", pin: "none",       lo: "mixo" }
    steps:
      - name: Pulling the new commit
        uses: actions/checkout@v4
      - name: Cek konflik merge
        run: |
          OUT=$(grep -rnE '^(<<<<<<< |=======$|>>>>>>> )' . --exclude-dir=.git --include=*.hx --include=*.xml --include=*.json --include=*.hxml --include=*.yml || true)
          if [ -n "$OUT" ]; then
            echo "$OUT" | head -20
            echo "=== ADA PENANDA KONFLIK. Selesaikan dulu sebelum build. ==="
            exit 1
          fi
          echo "Tidak ada penanda konflik."
      - name: Setting up Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: ${{ matrix.haxe }}
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@main
        with:
          ndk-version: r25c
      - name: Restore Previous Cache
        id: cache-debug-build-android-restore
        uses: actions/cache/restore@main
        with:
          path: |
            .haxelib/
            export/release/android/haxe/
            export/release/android/obj/
          key: cache-android-build-${{ matrix.name }}-solver3
      - name: Installing libraries
        run: |
          haxe -cp commandline -D analyzer-optimize --run Main setup -s

      - name: Solver build
        env:
          PIN: ${{ matrix.pin }}
          LO0: ${{ matrix.lo }}
        run: |
          git config --global advice.detachedHead false
          ROOT=$(pwd)
          LIBS="$ROOT/.haxelib"
          fl="$LIBS/flixel/git"; ad="$LIBS/flixel-addons/git"
          hs="$LIBS/hscript-improved/git"; hx="$LIBS/hxcpp/git"
          TRACE="$ROOT/trace.txt"; : > "$TRACE"
          SEEN="$ROOT/seen.txt";   : > "$SEEN"

          for d in "$LIBS"/*/git; do
            [ -d "$d/.git" ] && git -C "$d" fetch -q --all || true
          done

          # --- mesin waktu: pin semua library git ke sebelum tanggal PIN ---
          if [ "$PIN" != "none" ]; then
            for d in "$LIBS"/*/git; do
              [ -d "$d/.git" ] || continue
              T=$(git -C "$d" rev-list -n 1 --before="$PIN 23:59:59" HEAD 2>/dev/null || true)
              if [ -n "$T" ]; then git -C "$d" checkout -q -f "$T" || true; fi
            done
            echo "semua library git di-pin ke sebelum $PIN" >> "$TRACE"
          fi

          # --- lime resmi (punya ndll) sebagai tool ---
          if [ ! -d "$LIBS/lime/8,3,2" ]; then
            haxelib install lime 8.3.2 --skip-dependencies > /dev/null 2>&1 || haxelib install lime 8.3.2 > /dev/null 2>&1 || true
          fi
          haxelib set lime 8.3.2 > /dev/null || true
          if [ -d "$LIBS/lime/git" ] && [ -d "$LIBS/lime/8,3,2/ndll" ]; then
            for D in Linux Linux64; do
              if [ -d "$LIBS/lime/8,3,2/ndll/$D" ] && [ ! -f "$LIBS/lime/git/ndll/$D/lime.ndll" ]; then
                mkdir -p "$LIBS/lime/git/ndll/$D"
                cp -r "$LIBS/lime/8,3,2/ndll/$D/." "$LIBS/lime/git/ndll/$D/"
                echo "ndll $D disalin ke lime git" >> "$TRACE"
              fi
            done
          fi
          # --- paket resmi untuk mode legacy ---
          if [ "$LO0" = "legacy" ]; then
            haxelib install lime 8.1.2 --skip-dependencies > /dev/null 2>&1 || true
            haxelib install openfl 9.2.2 --skip-dependencies > /dev/null 2>&1 || true
            haxelib set lime 8.3.2 > /dev/null || true
          fi

          # --- titik acuan ---
          FL_ORIG=$(git -C "$fl" rev-parse HEAD)
          AD_ORIG=$(git -C "$ad" rev-parse HEAD)
          HS_ORIG=$(git -C "$hs" rev-parse HEAD)
          if [ "$PIN" != "none" ]; then
            AD_DEV=$(git -C "$ad" rev-list -n 1 --before="$PIN 23:59:59" origin/dev 2>/dev/null || echo "$AD_ORIG")
          else
            AD_DEV=$(git -C "$ad" rev-parse origin/dev 2>/dev/null || echo "$AD_ORIG")
          fi
          A=$(git -C "$hs" log --format=%H -S"IMPORT_BLACKLIST" origin/codename-dev 2>/dev/null | tail -1)
          if [ -n "$A" ]; then
            HS_BEFORE=$(git -C "$hs" rev-parse "${A}^")
          else
            HS_BEFORE=$(git -C "$hs" rev-parse origin/codename-dev 2>/dev/null || echo "$HS_ORIG")
          fi
          hs_ref() {
            case $HSI in
              0) echo "$HS_ORIG" ;;
              1) echo "$HS_BEFORE" ;;
              2) git -C "$hs" rev-parse origin/codename-dev ;;
              *) git -C "$hs" rev-parse origin/master ;;
            esac
          }

          # --- state awal ---
          if [ "$PIN" != "none" ]; then
            FL=$FL_ORIG
          else
            FL=$(git -C "$fl" rev-parse origin/old 2>/dev/null || echo "$FL_ORIG")
          fi
          AD=$AD_ORIG; UI=2.6.1; HSI=0; LO=$LO0; FLWALK=0; AUDIOFIX=0

          ver() {
            sed -n 's/.*"version"[^"]*"\([^"]*\)".*/\1/p' "$LIBS/$1/git/haxelib.json" 2>/dev/null | head -1
          }

          apply_state() {
            git -C "$ROOT" checkout -- source 2>/dev/null || true
            git -C "$fl" checkout -q -f "$FL" || true
            git -C "$ad" checkout -q -f "$AD" || true
            git -C "$hs" checkout -q -f "$(hs_ref)" || true
            haxelib install flixel-ui "$UI" --skip-dependencies > /dev/null 2>&1 || haxelib install flixel-ui "$UI" > /dev/null 2>&1 || true
            haxelib set flixel git > /dev/null || true
            haxelib set flixel-addons git > /dev/null || true
            haxelib set hscript-improved git > /dev/null || true
            haxelib set flixel-ui "$UI" > /dev/null || true
            case $LO in
              legacy)   haxelib set lime 8.1.2 > /dev/null; haxelib set openfl 9.2.2 > /dev/null ;;
              fork)     haxelib set lime git > /dev/null;   haxelib set openfl git > /dev/null ;;
              mixo)     haxelib set lime 8.3.2 > /dev/null; haxelib set openfl git > /dev/null ;;
              official) haxelib set lime 8.3.2 > /dev/null; haxelib set openfl 9.5.2 > /dev/null ;;
            esac
            for F in source/funkin/backend/system/framerate/Framerate.hx source/funkin/backend/system/framerate/FramerateCategory.hx; do
              if [ -f "$ROOT/$F" ]; then
                sed -i -E 's/(__enterFrame[[:space:]]*\([[:space:]]*[A-Za-z_]+[[:space:]]*:[[:space:]]*)Float/\1Int/' "$ROOT/$F" || true
              fi
            done
            for F in $(find "$LIBS/flixel-ui" -name FlxUICursor.hx); do
              sed -i 's/InputMethod:Int = INPUT_KEYS/InputMethod:Int = 1/' "$F" || true
            done
          }

          attempt() {
            rm -rf "$ROOT/export"
            ( set -o pipefail; haxelib run lime build android -final 2>&1 | tee build.log ) &
            PID=$!
            PASSED=0
            for i in $(seq 1 24); do
              sleep 5
              kill -0 $PID 2>/dev/null || break
            done
            if kill -0 $PID 2>/dev/null; then
              PASSED=1
              echo ">>> LOLOS pemeriksaan Haxe, lanjut build penuh (sekitar 50 menit)"
            fi
            wait $PID && RC=0 || RC=$?
          }

          learn() {
            CH=0; L=build.log
            if grep -q "Could not load lime.ndll" $L && [ "$LO" != "mixo" ]; then
              LO=mixo; CH=1; echo "iter $IT: lime -> resmi 8.3.2 (ndll)" >> "$TRACE"
            fi
            if grep -q "Unsupported Flixel Addons version" $L && [ "$AD" != "$AD_DEV" ]; then
              AD=$AD_DEV; CH=1; echo "iter $IT: addons -> dev" >> "$TRACE"
            fi
            if grep -q "Unsupported Flixel UI version" $L && [ "$UI" != "2.6.4" ]; then
              UI=2.6.4; CH=1; echo "iter $IT: flixel-ui -> 2.6.4" >> "$TRACE"
            fi
            if grep -q "Unexpected #end" $L && [ "$FLWALK" -lt 30 ]; then
              FL=$(git -C "$fl" rev-parse "${FL}^" 2>/dev/null || echo "$FL")
              FLWALK=$((FLWALK+1)); CH=1; echo "iter $IT: flixel mundur 1 commit ($FLWALK)" >> "$TRACE"
            fi
            if grep -qE "Loop in class building|IMPORT_BLACKLIST" $L && [ "$HSI" -lt 3 ]; then
              HSI=$((HSI+1)); CH=1; echo "iter $IT: hscript-improved -> mode $HSI" >> "$TRACE"
            fi
            if grep -q "Type not found : lime.media.Audio" $L && [ "$AUDIOFIX" = "0" ]; then
              FL=$(git -C "$fl" rev-list -n 1 --before="2026-02-26 00:00:00" "$FL" 2>/dev/null || echo "$FL")
              AUDIOFIX=1; CH=1; echo "iter $IT: flixel sebelum audio rework" >> "$TRACE"
            fi
            if grep -q "has no field __clear" $L && [ "$LO" != "fork" ]; then
              LO=fork; CH=1; echo "iter $IT: lime/openfl -> fork" >> "$TRACE"
            fi
          }

          # --- setup Android + rebuild hxcpp (lime resmi 8.3.2 sebagai tool) ---
          haxelib set lime 8.3.2 > /dev/null || true
          haxelib run lime setup -alias -y > /dev/null
          haxelib run lime config ANDROID_SDK $ANDROID_HOME > /dev/null
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_HOME > /dev/null
          haxelib run lime config JAVA_HOME $JAVA_HOME_17_X64 > /dev/null
          haxelib run lime config ANDROID_SETUP true > /dev/null

          if ! haxelib run lime rebuild hxcpp > rebuild.log 2>&1; then
            echo "hxcpp gagal, pin ke sebelum 2026-01-22" >> "$TRACE"
            T=$(git -C "$hx" rev-list -n 1 --before="2026-01-22 23:59:59" HEAD 2>/dev/null || true)
            if [ -n "$T" ]; then git -C "$hx" checkout -q -f "$T" || true; fi
            if ! haxelib run lime rebuild hxcpp > rebuild.log 2>&1; then
              echo "=== rebuild hxcpp gagal ==="
              grep -E "characters|Error" rebuild.log | head -3 | cut -c1-170
              exit 1
            fi
          fi

          # --- loop solver ---
          FOUND=0; IT=0
          while [ "$IT" -lt 40 ]; do
            IT=$((IT+1))
            SIG=$(echo "$FL $AD $UI $HSI $LO" | sha1sum | cut -c1-12)
            if grep -q "^$SIG$" "$SEEN"; then echo "state berulang, berhenti" >> "$TRACE"; break; fi
            echo "$SIG" >> "$SEEN"

            apply_state
            echo "### iter $IT flixel=$(echo $FL | cut -c1-7) addons=$(ver flixel-addons) ui=$UI hs=$HSI lo=$LO"
            attempt
            if [ "$RC" = "0" ]; then FOUND=1; echo "BERHASIL pada iter $IT"; break; fi
            if [ "$PASSED" = "1" ]; then
              echo "[LOLOS Haxe tapi gagal di tahap lanjut]" >> "$TRACE"
              grep -iE "error" build.log | tail -6 | cut -c1-200 >> "$TRACE" || true
              break
            fi
            learn
            if [ "$CH" = "0" ]; then echo "tidak ada aturan yang cocok, berhenti" >> "$TRACE"; break; fi
          done

          echo ""
          echo "=========== RINGKASAN (iter $IT) ==========="
          cat "$TRACE" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$FOUND" != "1" ]; then
            echo "--- error terakhir ---"
            grep -E "characters [0-9]+-[0-9]+ : |lines [0-9]+-[0-9]+ : |Error|Could not load" build.log | grep -v "Warning" | sort -u | head -8 | sed -E 's#^.*/\.haxelib/##; s#characters [0-9]+-[0-9]+ ##' | cut -c1-170 | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Clear Previous Cache
        uses: actions/github-script@main
        with:
          script: |
            try {
              const caches = await github.rest.actions.getActionsCacheList({
                owner: context.repo.owner,
                repo: context.repo.repo,
              })
              if (typeof caches.data.actions_caches != null && caches.data.actions_caches.length > 0) {
                for (const cache of caches.data.actions_caches) {
                  if (cache.key == "cache-android-build-${{ matrix.name }}-solver3") {
                    console.log('Clearing ' + cache.key + '...')
                    await github.rest.actions.deleteActionsCacheById({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      cache_id: cache.id,
                    })
                    console.log("Previous Cache Cleared!")
                  }
                }
              }
            } catch (error) {
              console.log(error.message);
            }
      - name: Save Current Cache
        id: cache-release-build-android-save
        uses: actions/cache/save@main
        with:
          path: |
            .haxelib/
            export/release/android/haxe/
            export/release/android/obj/
          key: cache-android-build-${{ matrix.name }}-solver3
      - name: Uploading artifact (entire build)
        uses: actions/upload-artifact@v4
        with:
          name: Codename Engine Legacy Android (${{ matrix.name }})
          path: export/release/android/bin/app/build/outputs/apk/*
      - name: Create release
        if: success() && inputs.release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}-${{ matrix.name }}
          name: Codename Engine Legacy Android #${{ github.run_number }} (${{ matrix.name }})
          files: export/release/android/bin/app/build/outputs/apk/**/*.apk
