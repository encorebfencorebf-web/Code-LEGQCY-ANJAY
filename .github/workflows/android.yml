name: Android Build
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Buat GitHub Release dari APK"
        type: boolean
        default: false
jobs:
  build:
    name: Android Build (auto pilih library)
    permissions: write-all
    runs-on: ubuntu-22.04
    steps:
      - name: Pulling the new commit
        uses: actions/checkout@v4
      - name: Setting up Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@main
        with:
          ndk-version: r25c
      - name: Restore Previous Cache
        id: cache-debug-build-android-restore
        uses: actions/cache/restore@main
        with:
          path: |
            .haxelib/
            export/release/android/haxe/
            export/release/android/obj/
          key: cache-android-build-hx437-auto
      - name: Installing/Updating libraries
        run: |
          haxe -cp commandline -D analyzer-optimize --run Main setup -s
          haxelib run lime rebuild hxcpp

      - name: Smart pin, configure and build
        run: |
          ROOT=$(pwd)
          SUMMARY="$ROOT/summary.txt"
          : > "$SUMMARY"

          echo "##### CONFIGURE ANDROID #####"
          haxelib run lime setup -alias -y
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME_17_X64
          haxelib run lime config ANDROID_SETUP true

          echo "##### PIN HSCRIPT-IMPROVED (sebelum IMPORT_BLACKLIST) #####"
          cd "$ROOT/.haxelib/hscript-improved/git"
          git fetch --all || true
          git checkout -f origin/codename-dev
          A=$(git log --format=%H -S"IMPORT_BLACKLIST" | tail -1)
          if [ -n "$A" ]; then
            git checkout -f "${A}^"
          fi
          git log -1 --format="hscript-improved: %h %ad %s" --date=short
          cd "$ROOT"

          echo "##### FLIXEL-UI git (disiapkan sebagai opsi) #####"
          haxelib git flixel-ui https://github.com/HaxeFlixel/flixel-ui || true

          # Daftar kandidat: "branch-flixel  mode-lime/openfl  flixel-ui"
          # mode: fork = lime git + openfl git + patch Framerate
          #       mixo = lime 8.3.2 resmi + openfl git + patch Framerate
          #       official = lime 8.3.2 + openfl 9.5.2 resmi
          CANDIDATES=(
            "cne fork release"
            "cne mixo release"
            "cne official release"
            "cne fork git"
            "cne mixo git"
            "cne official git"
            "old fork release"
            "old mixo release"
            "old official release"
            "old fork git"
            "old mixo git"
            "old official git"
          )

          apply() {
            FL=$1; LO=$2; UI=$3
            git -C "$ROOT" checkout -- source 2>/dev/null || true
            git -C "$ROOT/.haxelib/flixel/git" checkout -f origin/$FL || true
            haxelib set flixel git
            PATCH=0
            case $LO in
              fork)     haxelib set lime git;   haxelib set openfl git;   PATCH=1 ;;
              mixo)     haxelib set lime 8.3.2; haxelib set openfl git;   PATCH=1 ;;
              official) haxelib set lime 8.3.2; haxelib set openfl 9.5.2; PATCH=0 ;;
            esac
            if [ "$UI" = "git" ]; then
              haxelib set flixel-ui git || true
            else
              haxelib set flixel-ui 2.6.1 || true
            fi
            if [ "$PATCH" = "1" ]; then
              for F in source/funkin/backend/system/framerate/Framerate.hx source/funkin/backend/system/framerate/FramerateCategory.hx; do
                if [ -f "$ROOT/$F" ]; then
                  sed -i -E 's/(__enterFrame[[:space:]]*\([[:space:]]*[A-Za-z_]+[[:space:]]*:[[:space:]]*)Float/\1Int/' "$ROOT/$F" || true
                fi
              done
            fi
          }

          attempt() {
            rm -rf "$ROOT/export"
            ( set -o pipefail; haxelib run lime build android -final 2>&1 | tee build.log ) &
            PID=$!
            PASSED=0
            for i in $(seq 1 24); do
              sleep 5
              kill -0 $PID 2>/dev/null || break
            done
            if kill -0 $PID 2>/dev/null; then
              PASSED=1
              echo ">>> Lolos pemeriksaan Haxe, lanjut build penuh"
            fi
            wait $PID && RC=0 || RC=$?
          }

          FOUND=0
          for C in "${CANDIDATES[@]}"; do
            set -- $C
            echo ""
            echo "########## KANDIDAT: flixel=$1 mode=$2 flixel-ui=$3 ##########"
            apply $1 $2 $3
            haxelib list | grep -E "^(lime|openfl|flixel|flixel-ui|hscript-improved):" || true
            attempt
            if [ "$RC" = "0" ]; then
              FOUND=1
              echo "BERHASIL dengan: $C"
              echo "$C" > chosen.txt
              break
            fi
            {
              echo "## $C (PASSED_HAXE=$PASSED)"
              grep -E "characters [0-9]+-[0-9]+ : |lines [0-9]+-[0-9]+ : |Error" build.log | grep -v "Warning" | sort -u | head -8 || true
              echo ""
            } >> "$SUMMARY"
            if [ "$PASSED" = "1" ]; then
              echo "Lolos Haxe tapi gagal di tahap lanjut. Berhenti di kandidat ini."
              break
            fi
          done

          cat "$SUMMARY" >> "$GITHUB_STEP_SUMMARY" || true

          if [ "$FOUND" != "1" ]; then
            echo ""
            echo "=========== RINGKASAN SEMUA KANDIDAT ==========="
            cat "$SUMMARY"
            echo "=========== BRANCH FLIXEL YANG PUNYA INPUT_KEYS ==========="
            for b in old cne dev; do
              echo "--- origin/$b"
              git -C "$ROOT/.haxelib/flixel/git" grep -n "INPUT_KEYS" origin/$b -- '*.hx' | head -5 || true
            done
            echo "=========== FlxUICursor.hx baris 236-246 ==========="
            for F in $(find "$ROOT/.haxelib/flixel-ui" -name FlxUICursor.hx | head -1); do
              sed -n '236,246p' "$F" || true
            done
            exit 1
          fi

      - name: Clear Previous Cache
        uses: actions/github-script@main
        with:
          script: |
            try {
              const caches = await github.rest.actions.getActionsCacheList({
                owner: context.repo.owner,
                repo: context.repo.repo,
              })
              if (typeof caches.data.actions_caches != null && caches.data.actions_caches.length > 0) {
                for (const cache of caches.data.actions_caches) {
                  if (cache.key == "cache-android-build-hx437-auto") {
                    console.log('Clearing ' + cache.key + '...')
                    await github.rest.actions.deleteActionsCacheById({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      cache_id: cache.id,
                    })
                    console.log("Previous Cache Cleared!")
                  }
                }
              }
            } catch (error) {
              console.log(error.message);
            }
      - name: Save Current Cache
        id: cache-release-build-android-save
        uses: actions/cache/save@main
        with:
          path: |
            .haxelib/
            export/release/android/haxe/
            export/release/android/obj/
          key: cache-android-build-hx437-auto
      - name: Uploading artifact (entire build)
        uses: actions/upload-artifact@v4
        with:
          name: Codename Engine Legacy Android
          path: export/release/android/bin/app/build/outputs/apk/*
      - name: Create release
        if: success() && inputs.release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: Codename Engine Legacy Android #${{ github.run_number }}
          files: export/release/android/bin/app/build/outputs/apk/**/*.apk
